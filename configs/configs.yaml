defaults:
  - env: random_goal
  - model: size12M
  - buffer: her
  # Disable Hydra's Python logging-to-file (train.log)
  - override hydra/job_logging: disabled
  - _self_

logdir: logdir/${now:%Y-%m-%d}/${now:%H-%M-%S}
seed: 0
deterministic_run: False
device: "cuda:0"

hydra:
  run:
    dir: ${logdir}

batch_size: 16
batch_length: 64
goal_type: full
mission_text: False
# Train only the world model (encoder, RSSM, projector). Actor, critic and
# text_encoder are still instantiated (so the checkpoint contains them and
# they can be trained later) but are excluded from the optimizer and their
# losses are skipped. The env is stepped with uniform one-hot actions.
wm_only: False

env:
  goal_type: ${goal_type}
  stochastic_classes: ${model.rssm.discrete}
  stochastic_rows: ${model.rssm.stoch}
  goal_sample: buffer # buffer|text|random
  mission_text: ${mission_text}

model:
  goal_type: ${goal_type}
  mission_text: ${mission_text}
  wm_only: ${wm_only}

buffer:
  goal_type: ${goal_type}

# buffer:
#   batch_size: ${batch_size}
#   batch_length: ${batch_length}
#   max_size: 5e5
#   device: ${device}
#   storage_device: "cpu"
#   type: "her"
#   her_ratio: 0.8
#   her_strategy: final
#   n_envs: ${env.env_num}

trainer:
  steps: ${env.steps}
  pretrain: 0
  eval_every: 1e4
  eval_episode_num: ${env.eval_episode_num}
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  train_ratio: ${env.train_ratio}
  video_pred_log: False
  params_hist_log: False
  update_log_every: 5e3
  action_repeat: ${env.action_repeat}
  goal_sample: ${env.goal_sample}
  wm_only: ${wm_only}
