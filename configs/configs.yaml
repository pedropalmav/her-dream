defaults:
  - env: random_goal
  - model: size12M
  - buffer: her
  # Disable Hydra's Python logging-to-file (train.log)
  - override hydra/job_logging: disabled
  - _self_

logdir: logdir/${now:%Y-%m-%d}/${now:%H-%M-%S}
seed: 0
deterministic_run: False
device: "cuda:0"

hydra:
  run:
    dir: ${logdir}

batch_size: 16
batch_length: 64
goal_type: full

env:
  goal_type: ${goal_type}
  stochastic_classes: ${model.rssm.discrete}
  stochastic_rows: ${model.rssm.stoch}

model:
  goal_type: ${goal_type}

buffer:
  goal_type: ${goal_type}

# buffer:
#   batch_size: ${batch_size}
#   batch_length: ${batch_length}
#   max_size: 5e5
#   device: ${device}
#   storage_device: "cpu"
#   type: "her"
#   her_ratio: 0.8
#   her_strategy: final
#   n_envs: ${env.env_num}

trainer:
  steps: ${env.steps}
  pretrain: 0
  eval_every: 1e4
  eval_episode_num: ${env.eval_episode_num}
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  train_ratio: ${env.train_ratio}
  video_pred_log: False
  params_hist_log: False
  update_log_every: 5e3
  action_repeat: ${env.action_repeat}
