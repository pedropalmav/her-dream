# @package _global_
goal_type: prob
state_repr: dist # stoch | dist | logit   (reward fn's state arg)
goal_repr: sample # sample | argmax | logit (the goal tensor)
scope: full # first_row | full          (actor/critic goal input)
uses_threshold: false
# already non-negative: reward is offset + prob, and 0 keeps the historical [0, 1].
# Set to 0.0 on the -1-based types for a non-negative scheme (see rewards.py).
reward_offset: 0.0
