[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "her-dream"
version = "0.1.0"
description = "Goal-conditioned R2-Dreamer (HER buffer + Dreamer world model)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ale-py==0.11.2",
    "av>=17.0.0",
    # The grid environments shared with the sibling cookie-env project. Pinned to a
    # commit rather than a tag because the lava envs still live on cookie-env's
    # `feat/lava-grid` / `feat/lava-positions`; move this to a tag once they land on
    # its main. This SHA is the one that carries `LavaGrid.lava_pos`, which
    # envs/__init__.py, envs/goal_image.py and experiments/common/envs.py require.
    #
    # Unlike the first attempt at this dependency (#67/#70, reverted in #72), it no
    # longer drags the stack along. cookie-env now requires Python >=3.11 and
    # declares lower-bound-only deps on what it actually imports (gymnasium>=1.2.1,
    # minigrid>=3.0.0, numpy>=1.26.0, pygame) — all satisfied by the pins below, so
    # nothing here moves. Version floors that get in the way are lowered on the
    # cookie-env side; this file stays the fixed floor.
    "cookie-env @ git+https://github.com/pedropalmav/cookie-env.git@900ccd9499103a5cbeb61168901de0489fa88662",
    "crafter==1.8.0",
    "dash>=4.1.0",
    "dm-control==1.0.28",
    "einops==0.3.0",
    "gym==0.26.2",
    "gymnasium==1.2.1",
    "hydra-core==1.3.2",
    "memory-maze==1.0.3",
    "metaworld==3.0.0",
    "minigrid>=3.0.0",
    "moviepy==1.0.3",
    "mujoco==3.3.0",
    "numpy==1.26.0",
    "opencv-python==4.7.0.72",
    "plotly>=6.7.0",
    "protobuf==3.20.0",
    "ruamel-yaml==0.17.4",
    "setuptools<70",
    "tensorboard==2.17.1",
    "tensordict==0.9.1",
    "torch==2.8.0",
    "torchrl==0.9.2",
    "torchvision>=0.23.0",
    "wandb>=0.25.0",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.115",
    "matplotlib>=3.10.8",
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "scikit-learn>=1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
    "ignore:torch.meshgrid.*indexing:UserWarning",
    "ignore:This overload of addcmul_ is deprecated:UserWarning",
    "ignore::PendingDeprecationWarning:ruamel",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:crafter",
    "ignore::PendingDeprecationWarning:crafter",
    "ignore::DeprecationWarning:pygame",
    "ignore:.*precision lowered.*:UserWarning:gymnasium",
]

[tool.setuptools.packages.find]
include = ["her_dream*"]

[tool.setuptools.package-data]
her_dream = ["configs/**/*.yaml"]

[tool.coverage.run]
source = ["her_dream"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "SIM", "RET", "I", "UP"]
ignore = ["E203"]

[tool.ruff.format]
preview = true
