[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "her-dream"
version = "0.1.0"
description = "Goal-conditioned R2-Dreamer (HER buffer + Dreamer world model)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ale-py==0.11.2",
    "av>=17.0.0",
    "crafter==1.8.0",
    "dash>=4.1.0",
    "dm-control==1.0.28",
    "einops==0.3.0",
    "gym==0.26.2",
    "gymnasium==1.2.1",
    "hydra-core==1.3.2",
    "memory-maze==1.0.3",
    "metaworld==3.0.0",
    "minigrid>=3.0.0",
    "moviepy==1.0.3",
    "mujoco==3.3.0",
    "numpy==1.26.0",
    "opencv-python==4.7.0.72",
    "plotly>=6.7.0",
    "protobuf==3.20.0",
    "ruamel-yaml==0.17.4",
    "setuptools<70",
    "tensorboard==2.17.1",
    "tensordict==0.9.1",
    "torch==2.8.0",
    "torchrl==0.9.2",
    "torchvision>=0.23.0",
    "tqdm>=4.67.3",
    "wandb>=0.25.0",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.115",
    "matplotlib>=3.10.8",
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "scikit-learn>=1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
    "ignore:torch.meshgrid.*indexing:UserWarning",
    "ignore:This overload of addcmul_ is deprecated:UserWarning",
    "ignore::PendingDeprecationWarning:ruamel",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:crafter",
    "ignore::PendingDeprecationWarning:crafter",
    "ignore::DeprecationWarning:pygame",
    "ignore:.*precision lowered.*:UserWarning:gymnasium",
]

[tool.setuptools.packages.find]
include = ["her_dream*"]

[tool.setuptools.package-data]
her_dream = ["configs/**/*.yaml"]

[tool.coverage.run]
source = ["her_dream"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "SIM", "RET", "I", "UP"]
ignore = ["E203"]

[tool.ruff.format]
preview = true
