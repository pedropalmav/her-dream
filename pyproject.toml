[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "her-dream"
version = "0.1.0"
description = "Goal-conditioned R2-Dreamer (HER buffer + Dreamer world model)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ale-py==0.11.2",
    "av>=17.0.0",
    # Grid environments shared with the cookie-env project. Pinned to a tag so the
    # GPU server resolves it reproducibly; for local work against an unreleased
    # cookie-env, override with `uv pip install -e ../cookie-env`.
    "cookie-env @ git+https://github.com/pedropalmav/cookie-env.git@v0.6.0",
    "crafter==1.8.0",
    "dash>=4.1.0",
    "dm-control==1.0.44",
    # Only present because `memory_maze/__init__.py` imports gym to register its
    # env ids and re-raises if it is missing — nothing in her_dream imports it.
    # Do not call `gym.make()`: its passive env checker uses `np.bool8`, removed
    # in numpy 2, which is why envs/memorymaze.py builds the dm_env task directly.
    "gym==0.26.2",
    "gymnasium==1.3.0",
    "hydra-core==1.3.2",
    "memory-maze==1.0.3",
    "metaworld==3.0.0",
    "minigrid>=3.1.0",
    "moviepy==2.1.2",
    "mujoco==3.11.0",
    # Pinned directly even though it only arrives via crafter: left unconstrained
    # the resolver satisfies `numpy>=2` by backtracking numba to 0.53.1, which
    # predates numpy caps and cannot build on Python 3.12.
    "numba>=0.61",
    "numpy==2.5.2",
    "opencv-python==5.0.0.93",
    "plotly>=6.7.0",
    "protobuf==3.20.0",
    # Must stay <0.18: 0.18 removed `safe_load()`, which crafter calls at import
    # time (crafter/constants.py). Relaxing this pin breaks `env=crafter`.
    "ruamel-yaml==0.17.4",
    "setuptools<70",
    "tensorboard==2.17.1",
    "tensordict==0.9.1",
    "torch==2.8.0",
    "torchrl==0.9.2",
    "torchvision>=0.23.0",
    "wandb>=0.28.2",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.115",
    "matplotlib>=3.10.8",
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "scikit-learn>=1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
    "ignore:torch.meshgrid.*indexing:UserWarning",
    "ignore:This overload of addcmul_ is deprecated:UserWarning",
    "ignore::PendingDeprecationWarning:ruamel",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:crafter",
    "ignore::PendingDeprecationWarning:crafter",
    "ignore::DeprecationWarning:pygame",
    "ignore:.*precision lowered.*:UserWarning:gymnasium",
]

[tool.setuptools.packages.find]
include = ["her_dream*"]

[tool.setuptools.package-data]
her_dream = ["configs/**/*.yaml"]

[tool.coverage.run]
source = ["her_dream"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "SIM", "RET", "I", "UP"]
ignore = ["E203"]

[tool.ruff.format]
preview = true
